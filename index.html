<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>منصة رَود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#F3F1FC;--surface:#FFFFFF;--surface2:#EEF2FF;--ink:#0B1F4B;--muted:#586387;--line:#DDE1F3;
  --cyan:#0096D6;--violet:#6B4CF2;--pink:#D8409F;--navy:#0B1F4B;
  --ok:#11905F;--okbg:#E2F6EC;--warn:#B87400;--warnbg:#FFF2D9;--bad:#C93650;--badbg:#FDE6EA;
  --grad:linear-gradient(90deg,#00C6FF 0%,#7A5CFF 55%,#FF6AD6 100%);
  --gradSoft:linear-gradient(135deg,#E9F1FF,#F5F2FF);
  --shadow:0 1px 2px rgba(11,31,75,.06),0 8px 24px -12px rgba(76,60,190,.22);
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060D26;--surface:#0D1A42;--surface2:#13245A;--ink:#EEF1FF;--muted:#A2ACD3;--line:#22356E;
  --cyan:#40D5FF;--violet:#A28DFF;--pink:#FF8ADF;--navy:#EEF1FF;
  --ok:#4CD9A0;--okbg:#0E3A30;--warn:#F6BE55;--warnbg:#3B2C0B;--bad:#FF7F93;--badbg:#431726;
  --gradSoft:linear-gradient(135deg,#10214F,#1A1650);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#060D26;--surface:#0D1A42;--surface2:#13245A;--ink:#EEF1FF;--muted:#A2ACD3;--line:#22356E;
  --cyan:#40D5FF;--violet:#A28DFF;--pink:#FF8ADF;--navy:#EEF1FF;
  --ok:#4CD9A0;--okbg:#0E3A30;--warn:#F6BE55;--warnbg:#3B2C0B;--bad:#FF7F93;--badbg:#431726;
  --gradSoft:linear-gradient(135deg,#10214F,#1A1650);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.6}
#app{max-width:1120px;margin-inline:auto;padding-inline:16px;padding-block:12px 64px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:30px;font-weight:800}h2{font-size:22px;font-weight:800}h3{font-size:17px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 16px;flex-wrap:wrap}
.bar .brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer}
.bar .brand img{height:44px;width:auto}
.bar .nav{display:flex;gap:8px;flex-wrap:wrap}
.mode{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.local{background:var(--warn)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:9px 18px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:15px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--violet)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 6px 18px -8px rgba(122,92,255,.7);padding:10.5px 20px}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface2)}
.btn.danger{color:var(--bad);border-color:var(--line)}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn img{height:22px;width:auto}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* inputs */
label.f{display:grid;gap:6px;font-weight:700;font-size:14px}
label.f small{font-weight:400;color:var(--muted)}
.in{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:16px}
.in:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--violet) 18%,transparent)}
textarea.in{min-height:90px;resize:vertical}
@keyframes pulseb{0%,100%{box-shadow:0 0 0 0 rgba(58,111,247,.55)}50%{box-shadow:0 0 0 9px rgba(58,111,247,0)}}.pulse{animation:pulseb 1.2s ease-in-out 5}
.ltr{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.exhero{margin-bottom:12px}.exsec{margin:12px 0}.exsec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.exsec-h h3{margin:0;font-size:17px}
.exq{padding:10px 0;border-top:1px solid var(--line)}.exq:first-of-type{border-top:0}.exq-t{font-weight:700;margin:0 0 8px;line-height:1.8}
.exopts{display:grid;gap:6px}.exopt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;background:var(--surface)}.exopt input{position:absolute;opacity:0;pointer-events:none}
.exopt b{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface2);flex:none}.exopt.on{border-color:#3A6FF7;background:#EEF3FF}.exopt.on b{background:#3A6FF7;color:#fff}
.exdefs{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:6px}.exdefs li{background:var(--surface2);border-radius:10px;padding:8px 12px;line-height:1.7}
.exmatch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}.exletters{display:flex;gap:5px}
.exl{width:40px;height:40px;border:1.5px solid var(--line);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer}.exl input{position:absolute;opacity:0;pointer-events:none}.exl.on{background:#3A6FF7;border-color:#3A6FF7;color:#fff}
.extrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;display:grid;gap:8px}.extrow h4{margin:0;color:#3A6FF7}
.exph{display:flex;flex-direction:column;gap:4px;align-items:flex-start}.exend{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));z-index:3;display:grid;gap:8px;box-shadow:0 -4px 18px rgba(11,19,43,.08)}.exend p{margin:0}
.xwrap{overflow-x:auto}.xtbl{width:100%;border-collapse:collapse;font-size:15px}.xtbl th,.xtbl td{padding:8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}.xtbl th{background:var(--surface2);font-weight:700}
.gr{padding:6px 10px;border-radius:10px;background:var(--surface2);line-height:1.7}.gr.ok{background:#E9F7EF}.gr.bad{background:#FDEEEE}

.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.stack{display:grid;gap:14px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.eyebrow{font-size:13px;font-weight:700;color:var(--violet)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.chip.v{background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--violet);border-color:transparent}
.chip.p{background:color-mix(in srgb,var(--pink) 14%,transparent);color:var(--pink);border-color:transparent}
.chip.c{background:color-mix(in srgb,var(--cyan) 14%,transparent);color:var(--cyan);border-color:transparent}
.meter{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden;min-width:60px}
.meter>i{display:block;height:100%;background:var(--grad);border-radius:99px}
.ico{width:30px;height:30px;object-fit:contain;flex:none}

/* home */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:stretch}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.welcome{background:var(--gradSoft);border:1px solid var(--line);border-radius:24px;padding:28px;display:grid;gap:18px;align-content:start;position:relative;overflow:hidden}
.welcome .logo{width:min(340px,80%);height:auto}
.welcome .tag{font-size:19px;color:var(--muted);font-weight:500}
.enter{display:grid;gap:12px;align-content:start}
.enter .in{font-size:19px;padding:14px 18px;border-radius:14px}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stage b{display:block;font-size:22px}
.stage span{font-size:13px;color:var(--muted)}
.byline{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;width:fit-content;max-width:100%}
.byline img{width:34px;height:34px;object-fit:contain}
.byline div{display:grid;line-height:1.35}
.byline span{font-size:12px;color:var(--muted)}
.byline b{font-size:17px;font-weight:800}
.byline small{font-size:13.5px;color:var(--violet);font-weight:700}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;background:var(--gradSoft);border:1px solid color-mix(in srgb,var(--violet) 35%,var(--line));color:var(--ink);white-space:nowrap}
.badge.sm{font-size:11.5px;padding:1px 8px;vertical-align:middle}
.sol .attimg img{max-width:140px;max-height:140px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;flex:none}
.profile h1{font-size:24px}
.foot{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;color:var(--muted);font-size:13px}
.foot b{color:var(--violet)}
.icons-strip{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-start}
.icons-strip img{width:34px;height:34px;object-fit:contain}
.matches{display:grid;gap:8px}
.matches button{text-align:start}

/* student */
.shead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(#7A5CFF calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:74px;height:74px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:20px}
.sect{display:grid;gap:12px;margin-top:26px}
.plan{margin-top:16px;display:flex;gap:16px;align-items:center;border-radius:var(--r);padding:18px 20px;background:var(--surface2);border:1px solid var(--line)}
.plan img{width:44px;height:44px;object-fit:contain;flex:none}
.plan p{color:var(--muted);margin-top:4px;max-width:65ch}
.plan.gold{background:var(--gradSoft);border-color:color-mix(in srgb,var(--violet) 35%,var(--line))}
.sect-h{display:flex;align-items:center;gap:10px}
.sect-h img{width:28px;height:28px;object-fit:contain}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;cursor:pointer;text-align:start;transition:transform .15s,border-color .15s}
.lcard:hover{transform:translateY(-2px);border-color:var(--violet)}
.lcard.locked{opacity:.55;cursor:default}.lcard.locked:hover{transform:none;border-color:var(--line)}
.lcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);text-align:center}
.msg{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--pink);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.msg.new{border-inline-start-color:var(--cyan)}
.msg small{color:var(--muted)}
.msg pre{white-space:pre-wrap;font:inherit;margin:0}
.atts{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.attimg{display:block;border:0;padding:0;background:none;cursor:zoom-in;border-radius:10px;overflow:hidden}
.attimg img{display:block;max-width:220px;max-height:160px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.attfile{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;background:var(--surface2);max-width:100%;overflow-wrap:anywhere}
.attfile:hover{border-color:var(--violet)}

/* lesson */
.video{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;background:#0B1F4B}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vlink{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;text-decoration:none;color:#fff;background:radial-gradient(circle at 30% 20%,#7A5CFF 0,transparent 55%),radial-gradient(circle at 80% 90%,#FF6AD6 0,transparent 50%),#0B1F4B;text-align:center;padding:16px}
.vlink .play{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.6);display:grid;place-items:center}
.vlink .play::after{content:"";border-style:solid;border-width:15px 0 15px 24px;border-color:transparent transparent transparent #fff;margin-inline-start:6px}
[dir="rtl"] .vlink .play::after{margin-inline-start:0;margin-inline-end:0;transform:translateX(3px)}
.q{display:grid;gap:10px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.opt{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt:hover{border-color:var(--violet)}
.opt.sel{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 8%,transparent)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt input{accent-color:var(--violet);width:18px;height:18px}
.cls-row{display:grid;gap:6px;padding-top:8px;border-top:1px dashed var(--line)}
.cls-item{font-weight:700}
.cls-opts{display:flex;flex-wrap:wrap;gap:6px}
.cls-btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:14px}
.cls-btn:hover:not(:disabled){border-color:var(--violet)}
.cls-btn.sel{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 12%,var(--surface))}
.cls-btn.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.cls-btn.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.cls-btn:disabled{cursor:default}
.fb{border-radius:10px;padding:10px 12px;background:var(--badbg);color:var(--bad);font-size:14.5px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.result{border-radius:18px;padding:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.result.pass{background:var(--okbg)}.result.fail{background:var(--warnbg)}
.result img{width:64px;height:64px;object-fit:contain}

/* teacher */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:18px}
.tab{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.tab img{width:20px;height:20px;object-fit:contain}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;color:var(--muted);font-size:14px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:2px}
.stat b{font-size:28px;font-weight:800}
.stat span{font-size:13.5px;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:11px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14.5px}
th{font-size:13px;color:var(--muted);font-weight:700;background:var(--surface2)}
tr:last-child td{border-bottom:0}
td .chips{display:flex;gap:4px;flex-wrap:wrap}
.namebtn{background:none;border:0;padding:0;font-weight:700;cursor:pointer;color:var(--ink);text-align:start}
.namebtn:hover{color:var(--violet)}
.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.lrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .grow{flex:1;min-width:0}
.lrow .t{font-weight:700;overflow-wrap:anywhere}
.lrow .acts{display:flex;gap:6px;flex-wrap:wrap}

/* honor board */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end}
@media (max-width:560px){.podium{grid-template-columns:1fr}}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;display:grid;gap:6px;justify-items:center}
.pod.first{background:var(--gradSoft);border-color:color-mix(in srgb,var(--violet) 40%,var(--line));padding-block:24px}
.pod img{width:54px;height:54px;object-fit:contain}
.pod .rk{font-size:13px;font-weight:800;color:var(--violet)}
.pod .nm{font-weight:800;font-size:17px}
.brow{display:grid;grid-template-columns:34px 1fr minmax(90px,1.1fr) minmax(90px,1.1fr) 70px;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow.h{font-size:12.5px;color:var(--muted);font-weight:700;background:var(--surface2)}
@media (max-width:620px){.brow{grid-template-columns:28px 1fr 64px}.brow .hide-s{display:none}}
.mini{display:grid;gap:3px;font-size:12.5px;color:var(--muted)}

/* modal */
#modal[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(6,13,38,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow-y:auto}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:22px;width:min(760px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;padding:22px;display:grid;gap:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.sheet .mh{display:flex;justify-content:space-between;gap:12px;align-items:center}
.qb{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.qb .optrow{display:flex;gap:8px;align-items:center}
.qb .optrow input[type=radio]{width:18px;height:18px;accent-color:var(--ok);flex:none}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px;background:var(--surface)}
.checks label:has(input:checked){border-color:var(--violet);background:color-mix(in srgb,var(--violet) 10%,var(--surface))}
.checks input{accent-color:var(--violet)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);background:var(--navy);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;box-shadow:var(--shadow)}
.note{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
.back{margin-bottom:10px}

function findStudents(q){
  const n=norm(q); if(!n) return [];
  const all=students();
  const names=s=>[s.name,...(s.aliases||[])].map(norm);
  const exact=all.filter(s=>names(s).includes(n));
  if(exact.length) return exact;
  if(n.split(' ').length>=2) return all.filter(s=>names(s).some(x=>x.startsWith(n)));
  return [];
}

  </section>${l.type==='enrich'&&(l.task||l.fields)?solutionPanel(l,p):''}`;
}

    ${l.noPhoto?'':`${inApp()?'<div class="fb">إذا لم تفتح الصور، افتحي المنصة في متصفح Chrome أو Safari (من القائمة ⋮ أو ⋯ اختاري «فتح في المتصفح»).</div>':''}<label class="btn" for="solIn" style="width:fit-content">${ICON('camera',20)} ${ph.length?'صور جديدة بدل السابقة':(l.photoReq?'صوّري (مطلوب)':'أضيفي صورة (اختياري)')}</label>
    <input id="solIn" type="file" accept="image/*" multiple hidden>`}
    ${pend.length?`<div class="atts">${pend.map((d,i)=>`<div class="attimg"><img src="${d}" alt="صورة ${i+1}"></div>`).join('')}</div><div><button class="btn sm ghost" data-act="clearsol">إلغاء الصور</button></div>`:''}
    ${(canSend||fields.length)&&p.review!=='accepted'?`<div class="row"><button class="btn primary" data-act="sendsol" data-id="${l.id}">${p.subAt?'إعادة الإرسال للمعلمة':'إرسال للمعلمة'}</button></div>`:''}

const qsetOf = (l,q) => (q&&q.mode==='post') ? (l.post||[]) : (l.quiz||[]);
const hasPost = l => l.type==='tahsili' && (l.post||[]).length>0;
const isCls = qq => qq.t==='classify'||qq.t==='match';
function qAnswered(qq,ans){ return isCls(qq) ? !!ans && qq.items.every((_,k)=>ans[k]!=null) : ans!=null; }
function qCorrect(qq,ans){ return isCls(qq) ? !!ans && qq.items.every((_,k)=>ans[k]===qq.a[k]) : ans===qq.a; }
function qHtml(qq,i,q){
  const done=q.done, ans=q.ans[i]; let body;
  if(isCls(qq)){
    body=`<p class="muted" style="font-size:14px">اختاري لكل عبارة ${qq.t==='match'?'مكانها':'فئتها'} المناسبة.</p>`+qq.items.map((it,k)=>{ const v=ans?.[k];
      return `<div class="cls-row"><span class="cls-item">${esc(it)}</span><div class="cls-opts">${qq.cats.map((c,ci)=>{ let cls=v===ci?'sel':''; if(done) cls=ci===qq.a[k]?'right':(v===ci?'wrong':'');
        return `<button type="button" class="cls-btn ${cls}" data-act="ansc" data-i="${i}" data-k="${k}" data-c="${ci}" ${done?'disabled':''}>${esc(c)}</button>`; }).join('')}</div></div>`; }).join('');
  } else {
    body=qq.o.map((o,j)=>{ const sel=ans===j; let cls=sel?'sel':''; if(done) cls=j===qq.a?'right':(sel?'wrong':'');
      return `<label class="opt ${cls}"><input type="radio" name="q${i}" data-act="ans" data-i="${i}" data-j="${j}" ${sel?'checked':''} ${done?'disabled':''}><span>${esc(o)}</span></label>`; }).join('');
  }
  const ok=done&&qCorrect(qq,ans);
  const fb=!done?'':ok?`<div class="fb ok">✓ إجابة صحيحة</div>`:`<div class="fb">✗ ${esc(qq.fb||'إجابة غير صحيحة، والإجابة الصحيحة مظلّلة بالأخضر.')}${qq.rv?`<br><b>راجعي: ${esc(qq.rv)}</b>`:''}</div>`;
  const ex=done&&qq.ex?`<div class="fb ex"><b>الشرح:</b> ${esc(qq.ex)}</div>`:'';
  return `<div class="q"><h3>${i+1}. ${esc(qq.q)}</h3>${qq.img?`<img class="qimg" src="${qq.img}" alt="شكل السؤال">`:''}${body}${qq.ex&&done?(ok?`<div class="fb ok">✓ إجابة صحيحة</div>`:`<div class="fb">✗ إجابتك غير صحيحة، والصحيحة مظلّلة بالأخضر.</div>`):fb}${ex}</div>`;
}
async function recordProgress(lid, patch){
  const sid=S.v.sid, pr=JSON.parse(JSON.stringify(prog(sid)));
  pr.lessons=pr.lessons||{};
  pr.lessons[lid]=Object.assign({best:0,attempts:0,passed:false},pr.lessons[lid]||{},patch(pr.lessons[lid]||{}));
  pr.lastActive=Date.now(); delete pr.id;
  return save('progress',sid,pr);
}

  <div class="podium2">${order.map(i=>{const r=top[i];return `<div class="pod2 p${i+1} ${me&&r.s.id===me.id?'me':''}"><div class="medal m${i+1}">${i+1}</div><b>${esc(r.s.name.split(' ').slice(0,2).join(' '))}</b><span class="muted">${val(r)}</span>${badgeChips(badgesOf(r.s,r.x).slice(0,1),1)}</div>`;}).join('')}</div>

function impReport(lid){ const l=S.data.lessons[lid], preN=(l.quiz||[]).length, postN=(l.post||[]).length;
  const rows=realStudents().filter(s=>+l.grade===0||+s.grade===+l.grade).map(s=>{ const p=(prog(s.id).lessons||{})[lid]||{}; if(!p.attempts) return null; const pre=p.firstOk??Math.round((p.first??0)*preN/100); const post=p.postOk; return {s,pre,post,fast:p.preSecs!=null&&p.preSecs<preN*10,secs:p.preSecs,d:post==null?null:(post/(p.postN||postN)-pre/preN)*100}; }).filter(Boolean).sort((a,b)=>(b.d??-999)-(a.d??-999));
  const both=rows.filter(r=>r.post!=null), avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length):null;
  const aPre=avg(both.map(r=>r.pre/preN*100)), aPost=avg(both.map(r=>r.post/postN*100));
  openModal(`${mh('تقرير التحسن: '+esc(l.title))}
    <p class="muted" style="font-size:13px">⚡ سريع: أنهت القبلي بأقل من 10 ثوانٍ للسؤال، فقد تكون درجتها القبلية والتحسن غير دقيقين.</p><p class="muted">بدأت ${rows.length} طالبة، وأنهت الاختبارين ${both.length}.${both.length?` متوسط القبلي <b class="num">${Math.round(aPre)}%</b> · متوسط البعدي <b class="num">${Math.round(aPost)}%</b> · متوسط التحسن <b class="num">${aPost-aPre>0?'+':''}${Math.round(aPost-aPre)}%</b>`:''}</p>
    ${rows.length?`<div class="tablewrap"><table style="min-width:0"><thead><tr><th>الطالبة</th><th>القبلي /${preN}</th><th>البعدي /${postN}</th><th>التحسن</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.s.name)}</td><td class="num">${r.pre}${r.fast?` <span class="chip" style="background:var(--warnbg);color:var(--warn)" title="أنهت القبلي في ${r.secs} ثانية">⚡ سريع</span>`:''}</td><td class="num">${r.post??'—'}</td><td class="num"><b>${r.d==null?'لم تُكمل':(r.d>0?'+':'')+Math.round(r.d)+'%'}</b></td></tr>`).join('')}</tbody></table></div>`:'<p>لم تبدأ أي طالبة بعد.</p>'}`); }

async function shrinkImage(file,limit=600000){
  const im=await loadImg(file); const W=im.width, H=im.height; if(!W||!H) throw new Error('empty');
  let max=1600, q=.82, out='';
  for(let k=0;k<7;k++){ const sc=Math.min(1,max/Math.max(W,H)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(W*sc)); c.height=Math.max(1,Math.round(H*sc)); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); out=c.toDataURL('image/jpeg',q); if(out.length<limit) break; max=Math.round(max*.8); q=Math.max(.55,q-.06); }
  if(im.close) try{ im.close(); }catch(e){}
  if(!out||out.length<100) throw new Error('canvas');
  return out;
}
async function uploadAttachment(file){

    try{ const up=await S.assets.upload(file); return {name:file.name,kind,asset:up.id}; }
    catch(e){ throw new Error(e&&e.code==='unsupported_type'?`نوع «${file.name}» غير مدعوم. أرسلي صورة أو PDF.`:e&&e.code==='quota_or_state'?'امتلأت مساحة التخزين، احذفي ملفات قديمة أو أرسلي رابطًا.':`تعذّر رفع «${file.name}».`); }

}

/* teacher side */
S.keys={};
function needKey(lid){ if(S.keys[lid]!==undefined) return; S.keys[lid]=null; Store.get('keys',lid).then(k=>{ S.keys[lid]=k||false; scheduleRender(); }).catch(()=>{ S.keys[lid]=false; }); }
function exAuto(l,p,key){ if(!key||!p.exam) return null; let s=0; const P=l.paper; for(const x of P.sections){ const a=p.exam[x.id]||{};
  if(x.type==='mcq') x.items.forEach((_,i)=>{ if(a[i]!=null&&+a[i]===key[x.id][i]) s+=x.pointsEach; });
  if(x.type==='match') x.terms.forEach((_,i)=>{ if(a[i]===key[x.id][i]) s+=x.pointsEach; }); } return s; }
function exMarks(l,p,key){ const m={...(p.marks||{})}; const auto={}; if(key&&p.exam) for(const x of l.paper.sections) if(!x.manual){ const one={...l,paper:{sections:[x]}}; auto[x.id]=exAuto(one,p,key); }
  for(const k in auto) if(m[k]==null) m[k]=auto[k]; return m; }
function tPapers(){
  const P=lessons().filter(l=>l.paper&&(S.v.g==='all'||+l.grade===+S.v.g)); if(!P.length) return '';
  return P.map(l=>{ needKey(l.id); const key=S.keys[l.id], max=paperMax(l);
    const rows=(l.forIds||[]).map(id=>S.data.students[id]).filter(Boolean).map(s=>{ const p=(prog(s.id).lessons||{})[l.id]||{}; const m=exMarks(l,p,key); const tot=p.graded?p.total:null;
      const stt=p.status==='submitted'?(p.graded?['ok','مُصحَّح']:['c','أرسلت']):p.status==='draft'?['warn','تحل الآن']:['','لم تبدأ'];
      const auto=l.paper.sections.filter(x=>!x.manual).reduce((a,x)=>a+(m[x.id]??0),0);
      return `<tr><td><button class="namebtn" data-act="report" data-id="${s.id}">${esc(s.name)}</button></td><td><span class="chip ${stt[0]}">${stt[1]}</span>${p.subAt?` <small class="muted">${fmtDate(p.subAt)}</small>`:''}</td><td class="num">${p.exam&&key?fmtN(auto):'—'}</td><td class="num"><b>${tot!=null?fmtN(tot)+' / '+max:'—'}</b></td><td>${p.exam?`<button class="btn sm ${p.status==='submitted'&&!p.graded?'primary':''}" data-act="exgrade" data-id="${l.id}" data-s="${s.id}">${p.graded?'تعديل التصحيح':'فتح الإجابات'}</button>`:''}</td></tr>`; }).join('');
    return `<div class="panel stack" style="margin-top:18px"><div class="sect-h">${img('task')}<h3>${esc(l.title)} · ${GRADES[l.grade]}</h3><span class="chip ${l.closed?'':'ok'}">${l.closed?'مغلق':'مفتوح'}</span></div>
      <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="extoggle" data-id="${l.id}">${l.closed?'فتح الاختبار':'إغلاق الاختبار'}</button><button class="btn sm" data-act="excsv" data-id="${l.id}">تصدير النتائج CSV</button>${key===false?'<span class="chip bad">مفتاح الإجابة غير متاح</span>':''}</div>
      <div class="xwrap"><table class="xtbl"><tr><th>الطالبة</th><th>الحالة</th><th>التلقائي</th><th>المجموع</th><th></th></tr>${rows}</table></div></div>`; }).join('');
}
function gradeModal(lid,sid){ const l=S.data.lessons[lid], s=S.data.students[sid], p=(prog(sid).lessons||{})[lid]||{}, key=S.keys[lid]||null, a=p.exam||{}, m=exMarks(l,p,key);
  const secs=l.paper.sections.map(x=>{ const ans=a[x.id]||{}; let body='';
    if(x.type==='mcq') body=x.items.map((it,i)=>{ const v=ans[i], k=key?.[x.id]?.[i], ok=v!=null&&+v===k; return `<div class="gr ${v==null?'':ok?'ok':'bad'}"><span class="num">${i+1}.</span> ${bd(it.text)}<br><b>${v!=null?AR_L[v]+') '+bd(it.options[v]):'لم تُجب'}</b>${!ok&&k!=null?` <small>· الصحيحة: ${AR_L[k]}) ${bd(it.options[k])}</small>`:''}</div>`; }).join('');
    if(x.type==='match') body=x.terms.map((t,i)=>{ const v=ans[i], k=key?.[x.id]?.[i], ok=v===k; return `<div class="gr ${v==null?'':ok?'ok':'bad'}">${esc(t)}: <b>${v||'لم تُجب'}</b>${!ok&&k?` <small>· الصحيحة: ${k}</small>`:''}</div>`; }).join('');
    if(x.type==='table') body=`<div class="xwrap"><table class="xtbl"><tr><th></th>${x.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${x.rows.map((r,ri)=>`<tr><th>${esc(r)}</th>${x.columns.map((_,ci)=>`<td>${bd(ans[ri+'-'+ci]||'—')}${key?.guide?.[x.id]?.[r]?`<br><small class="muted">${bd(key.guide[x.id][r][ci])}</small>`:''}</td>`).join('')}</tr>`).join('')}</table></div>`;
    if(x.type==='short') body=(x.items||Array.from({length:x.count},(_,i)=>`${i+1}`)).map((t,i)=>`<div class="gr">${x.items?bd(t)+': ':''}<b>${bd(ans[i]||'لم تُجب')}</b>${Array.isArray(key?.guide?.[x.id])?` <small class="muted">· النموذج: ${bd(key.guide[x.id][i])}</small>`:''}</div>`).join('')+(typeof key?.guide?.[x.id]==='string'?`<p class="muted" style="font-size:14px">النموذج: ${bd(key.guide[x.id])}</p>`:'');
    if(x.type==='photo') body=`${(a.photos||[]).length?attHtml(a.photos.map((f,i)=>({name:'صورة الحل '+(i+1),kind:'image',fileId:f}))):'<p class="muted">لم ترفع صورة.</p>'}${key?.guide?.[x.id]?`<p class="muted" style="font-size:14px">النموذج: ${bd(key.guide[x.id])}</p>`:''}`;
    return `<div class="panel stack" style="gap:6px"><div class="row" style="justify-content:space-between;gap:8px"><b>${bd(x.title)}</b><label class="row" style="gap:6px;white-space:nowrap">الدرجة <input class="in num" type="number" step="0.25" min="0" max="${secMax(x)}" data-gm="${x.id}" value="${m[x.id]??''}" style="width:80px;padding:6px 8px"> / ${fmtN(secMax(x))}</label></div>${body}</div>`; }).join('');
  openModal(`<h2>${esc(s.name)}</h2><p class="muted">${esc(l.title)} · ${p.status==='submitted'?'أرسلت '+fmtDate(p.subAt):'لم ترسل بعد (مسودة)'}</p><div class="stack">${secs}</div>
    <div class="row" style="justify-content:space-between;margin-top:12px"><b>المجموع: <span id="gmTot" class="num">${fmtN(Object.values(m).reduce((a,b)=>a+(+b||0),0))}</span> من ${paperMax(l)}</b><div class="row" style="gap:8px"><button class="btn" data-act="close">إغلاق</button><button class="btn primary" data-act="exsavegrade" data-id="${lid}" data-s="${sid}">حفظ الدرجات</button></div></div>`);
}

  exgrade(e){ const lid=e.dataset.id, sid=e.dataset.s; const p=(prog(sid).lessons||{})[lid]||{}; (p.exam?.photos||[]).forEach(f=>{ if(!S.data.files[f]&&S.fetchFile) S.fetchFile(f); }); gradeModal(lid,sid); },
  async exsavegrade(e){ const lid=e.dataset.id, sid=e.dataset.s, l=S.data.lessons[lid]; const marks={}; M.querySelectorAll('[data-gm]').forEach(i=>{ if(i.value!=='') marks[i.dataset.gm]=Math.min(+i.max,Math.max(0,+i.value)); });
    const all=l.paper.sections.every(x=>marks[x.id]!=null); const total=Object.values(marks).reduce((a,b)=>a+b,0);
    const pr=JSON.parse(JSON.stringify(prog(sid))); pr.lessons=pr.lessons||{}; const cur=pr.lessons[lid]||{}; pr.lessons[lid]={...cur,marks,total,graded:all,gradedAt:Date.now()}; delete pr.id;
    if(await save('progress',sid,pr)){ closeModal(); toast(all?'حُفظ التصحيح ✓':'حُفظت الدرجات، وبقيت أسئلة بلا درجة'); } },
  excsv(e){ const l=S.data.lessons[e.dataset.id], key=S.keys[l.id]||null; const secs=l.paper.sections;
    const rows=[['الاسم',...secs.map((x,i)=>'السؤال '+(i+1)),'المجموع','الحالة']];

    const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=(l.title||'exam')+'.csv'; document.body.appendChild(a); a.click(); a.remove(); },
};

  report(e){ reportModal(e.dataset.id); }, msg(e){ msgModal(e.dataset.id); },
  close(){ closeModal(); }, closebg(){},
  askdel(e){ confirmDel(e.dataset.c,e.dataset.id); },
  async dodel(e){ const {c,id}=e.dataset; await remove(c,id); if(c==='students') await remove('progress',id); closeModal(); toast('تم الحذف'); },
  addskill(){ const inp=M.querySelector('#sNewSkill'); const v=inp.value.trim(); if(!v) return; const box=M.querySelector('#sSkills'); if(box.querySelector('.muted')) box.innerHTML=''; box.insertAdjacentHTML('beforeend',`<label><input type="checkbox" value="${esc(v)}" checked>${esc(v)}</label>`); inp.value=''; inp.focus(); },
  addq(){ syncQuiz(); draftQuiz.push({q:'',o:['','','',''],a:0}); M.querySelector('#qbuild').innerHTML=quizBuilder(); },
  delq(e){ syncQuiz(); draftQuiz.splice(+e.dataset.i,1); M.querySelector('#qbuild').innerHTML=quizBuilder(); },
  viewimg(e){ openModal(`${mh('الصورة')}<img src="${esc(e.dataset.src)}" alt="" style="width:100%;height:auto;border-radius:12px">`); },
  tpl(e){ M.querySelector('#mText').value=e.dataset.t; },
  async sendreport(e){ const s=S.data.students[e.dataset.id]; const d=JSON.parse(JSON.stringify(s)); delete d.id; d.messages=[...(d.messages||[]),{text:reportText(s),at:Date.now()}]; if(await save('students',s.id,d)) toast('أُرسل التقرير إلى الطالبة'); },
  async copyreport(e){ const t=reportText(S.data.students[e.dataset.id]); try{ await navigator.clipboard.writeText(t); toast('نُسخ التقرير، الصقيه في واتساب أو البريد'); }catch(err){ openModal(`${mh('انسخي التقرير')}<textarea class="in" id="rep" style="min-height:260px">${esc(t)}</textarea>`); M.querySelector('#rep').select(); } },
  async export(){ const t=JSON.stringify(S.data); const ta=document.getElementById('bk'); ta.value=t; try{ await navigator.clipboard.writeText(t); toast('نُسخت البيانات'); }catch(err){ ta.select(); toast('حدّدي النص وانسخيه'); } },
  async import(){ let d; try{ d=JSON.parse(document.getElementById('bk').value); }catch(err){ toast('النص ليس نسخة احتياطية صحيحة'); return; } let n=0; for(const c of COLS){ for(const [id,doc] of Object.entries(d[c]||{})){ const x={...doc}; delete x.id; if(await save(c,id,x)) n++; } } toast(`استُورد ${n} عنصرًا`); },
  async demo(){ await loadDemo(); toast('حُمّلت بيانات تجريبية'); },
};
document.addEventListener('click',ev=>{
  const e=ev.target.closest('[data-act]'); if(!e) return;
  const act=e.dataset.act; if(!A[act]) return;
  if(act==='closebg'){ if(ev.target===e) closeModal(); return; }
  if(e.tagName==='INPUT'){ A[act](e,ev); return; }
  if(act!=='watchlink') ev.preventDefault();
  A[act](e,ev);
});
document.addEventListener('change',ev=>{ if(ev.target.id==='xGrade'||ev.target.id==='xCh'){ const r=M.querySelector('#xRows'); if(r) r.innerHTML=examRows(M.querySelector('#xGrade').value,M.querySelector('#xCh').value); } });
document.addEventListener('change',async ev=>{ if(ev.target.id!=='solIn') return; const fs=[...ev.target.files].slice(0,3); if(!fs.length) return; toast('جارٍ تجهيز الصور…'); const ok=[]; let bad=null; for(const f of fs){ try{ ok.push(await shrinkImage(f,270000)); }catch(err){ bad=photoErr(f,err); } } if(ok.length) S.v.pendingPhotos=ok; render(); if(bad) toast(bad); else { toast('جُهّزت الصورة ✓ اضغطي «إرسال للمعلمة» لإكمال الإرسال'); setTimeout(()=>{ const b=document.querySelector('[data-act=sendsol]'); if(b){ b.scrollIntoView({block:'center',behavior:'smooth'}); b.classList.add('pulse'); } },150); } });
document.addEventListener('input',ev=>{ const sf=ev.target.dataset?.solf; if(sf){ const [lid,i]=sf.split('|'); S.v.solDraft=S.v.solDraft||{}; (S.v.solDraft[lid]=S.v.solDraft[lid]||{})[i]=ev.target.value; } if(ev.target.id==='nameIn') S.v.nameDraft=ev.target.value; });
document.addEventListener('change',ev=>{ if(ev.target.id==='sGrade'){ const box=M.querySelector('#sSkills'); const sel=[...box.querySelectorAll('input:checked')].map(i=>i.value); box.innerHTML=skillCheckboxes(+ev.target.value,sel); } });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&!M.hidden) closeModal(); });
document.addEventListener('submit',async ev=>{
  const f=ev.target; ev.preventDefault(); const k=f.dataset.form, $=s=>f.querySelector(s);
  if(k==='enter'){ if(norm(S.v.nameDraft) && norm(S.v.nameDraft)===norm(settings().pin)){ Object.assign(S.v,{nameDraft:'',matches:null,sid:null,screen:'teacher',teacher:S.mode!=='claude'}); render(); return; }
    const m=findStudents(S.v.nameDraft); if(m.length===1){ Object.assign(S.v,{sid:m[0].id,screen:'student',matches:null}); } else S.v.matches=m; render(); }
  if(k==='pin'){ if(norm($('#pinIn').value)===norm(settings().pin)){ S.v.teacher=true; S.v.pinErr=false; S.v.screen='teacher'; } else S.v.pinErr=true; render(); }
  if(k==='student'){ const id=f.dataset.id||rid(); const old=S.data.students[id]||{}; const keepS={...old}; delete keepS.id; const d={...keepS,name:$('#sName').value.trim().replace(/\s+/g,' '),grade:+$('#sGrade').value,weaknesses:[...$('#sSkills').querySelectorAll('input:checked')].map(i=>i.value),excellent:$('#sExc').checked,enrichOn:$('#sEnr').checked,enrichAfterPlan:$('#sAfter').checked,tested:$('#sTested').checked||$('#sExc').checked||$('#sSkills').querySelectorAll('input:checked').length>0,score:$('#sScore').value.trim(),note:$('#sNote').value.trim(),messages:old.messages||[],createdAt:old.createdAt||Date.now()};
    if(!d.name) return; if(await save('students',id,d)){ closeModal(); toast('حُفظت بيانات الطالبة'); } }
  if(k==='bulk'){ const g=+$('#bGrade').value; const names=[...new Set($('#bNames').value.split('\n').map(s=>s.replace(/^[\d\s.\-)]+/,'').trim().replace(/\s+/g,' ')).filter(Boolean))]; const exists=new Set(students().map(s=>norm(s.name))); let n=0;
    for(const nm of names){ if(exists.has(norm(nm))) continue; if(await save('students',rid(),{name:nm,grade:g,weaknesses:[],excellent:false,tested:false,score:'',messages:[],createdAt:Date.now()})) n++; }
    closeModal(); toast(`أُضيفت ${n} طالبة`); }
  if(k==='lesson'){ syncQuiz(); const quiz=draftQuiz.map(q=>{ if(isCls(q)) return q; const t=(q.q||'').trim(); if(!t) return null; const keep=q.o.map((o,j)=>({o:o.trim(),j})).filter(x=>x.o); if(keep.length<2) return null; const r={q:t,o:keep.map(x=>x.o),a:Math.max(0,keep.findIndex(x=>x.j===q.a))}; if(q.fb) r.fb=q.fb; if(q.rv) r.rv=q.rv; if(q.ex) r.ex=q.ex; if(q.img) r.img=q.img; return r; }).filter(Boolean);
    const id=f.dataset.id||rid(); const old=S.data.lessons[id]||{};
    const keep={...old}; delete keep.id; const d={...keep,title:$('#lTitle').value.trim(),type:$('#lType').value,grade:+$('#lGrade').value,skill:$('#lSkill').value.trim(),youtube:$('#lYt').value.trim(),desc:$('#lDesc').value.trim(),guide:$('#lGuide').value.trim(),task:$('#lTask').value.trim(),passAll:$('#lPassAll').checked,draft:$('#lDraft').checked,passMsg:old.passMsg||'',retryMsg:old.retryMsg||'',order:$('#lOrder').value?+$('#lOrder').value:null,quiz,createdAt:old.createdAt||Date.now()};
    if(d.type==='remedial'&&!d.skill){ toast('حدّدي المهارة للدرس العلاجي'); return; }
    if(d.type==='remedial'&&+d.grade===0){ toast('اختاري مرحلة محددة للدرس العلاجي'); return; }
    if(await save('lessons',id,d)){ closeModal(); toast('حُفظ الدرس'); } }
  if(k==='msg'){ const s=S.data.students[f.dataset.id]; const t=$('#mText').value.trim(); const files=[...$('#mFiles').files]; const link=$('#mLink').value.trim();
    if(link && !/^https?:\/\//i.test(link)){ toast('الرابط يجب أن يبدأ بـ https://'); return; }
    if(!t && !files.length && !link){ toast('اكتبي رسالة أو أرفقي ملفًا'); return; }
    const btn=$('#mSend'); btn.disabled=true; btn.textContent='جارٍ الإرسال…';
    const att=[];
    try{ for(const fl of files) att.push(await uploadAttachment(fl)); }
    catch(e){ toast(e.message); btn.disabled=false; btn.textContent='إرسال'; return; }
    if(link) att.push({name:'فتح الرابط',kind:'link',url:link});
    const cur=S.data.students[s.id]; const d=JSON.parse(JSON.stringify(cur)); delete d.id; const m={text:t,at:Date.now()}; if(att.length) m.att=att; d.messages=[...(d.messages||[]),m];
    if(await save('students',s.id,d)){ closeModal(); toast('أُرسلت الرسالة'); } else { btn.disabled=false; btn.textContent='إرسال'; } }
  if(k==='exam'){ const ch=$('#xCh').value.trim(), max=$('#xMax').value.trim(); if(!ch){ toast('اكتبي اسم الفصل'); return; } let n=0;
    for(const inp of f.querySelectorAll('[data-exs]')){ const v=inp.value.trim(); if(!v) continue; const s=S.data.students[inp.dataset.exs]; const d=JSON.parse(JSON.stringify(s)); delete d.id;
      const ex=storedExams(s).filter(e=>norm(e.ch)!==norm(ch)); const oldE=storedExams(s).find(e=>norm(e.ch)===norm(ch)); ex.push({ch,score:v,max:max||oldE?.max||'',at:Date.now()}); d.exams=ex; d.tested=true; if(await save('students',s.id,d)) n++; }
    closeModal(); toast(`رُصدت ${n} درجة`); }
  if(k==='settings'){ const pin=$('#setPin').value.trim(); const pm=Math.min(100,Math.max(10,+$('#setPass').value||66)); if(!pin){ toast('اكتبي كلمة سر'); return; } const vid=$('#setVid').value.trim(); if(vid&&!ytId(vid)){ toast('رابط الفيديو غير صحيح'); return; } if(await save('settings','main',{pin,passMark:pm,sequential:$('#setSeq').checked,aboutVideo:vid})) toast('حُفظت الإعدادات'); }
});
